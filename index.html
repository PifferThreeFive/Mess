<style>
:root{
  /* Layout: dark regimental header and login field, light paper workspace, bottom tabs on phones. */
  --field:#0d2c1b; --field-2:#143b26; --green:#14532d; --green-2:#1d6b3b;
  --regt-green:#137325; --regt-red:#d42a2a; --regt-yellow:#f4c518;
  --brass:#c9a453; --brass-2:#e4c886; --ivory:#f4efe2;
  --paper:#eef2ec; --card:#ffffff; --ink:#15211a; --muted:#5b6a60; --line:#d9e1d8; --soft:#f5f8f4;
  --official:#1f7a3a; --private:#d9a43a; --private-ink:#2b1e05;
  --ok:#1f7a3a; --ok-bg:#e2f1e5; --warn:#a26100; --warn-bg:#fdf0d5; --bad:#b42318; --bad-bg:#fbe5e2; --none:#667085; --none-bg:#eceff1;
  --f-brand:'Cinzel','Times New Roman',serif;
  --f-ui:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-cond:'Barlow Condensed','Barlow',system-ui,sans-serif;
  --ribbon:linear-gradient(90deg,var(--regt-green) 0 23%,var(--regt-red) 23% 41%,var(--regt-yellow) 41% 59%,var(--regt-red) 59% 77%,var(--regt-green) 77% 100%);
  --r:12px; --shadow:0 1px 2px rgba(13,44,27,.06),0 6px 18px rgba(13,44,27,.07);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;right:-70px;bottom:-40px;width:430px;height:496px;background:var(--img-crest) center/contain no-repeat;filter:brightness(0);opacity:.045;pointer-events:none;z-index:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:var(--green-2)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── buttons & inputs ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;flex:none;min-height:46px;padding:0 18px;border-radius:10px;border:1px solid transparent;background:var(--green);color:#fff;font-weight:600;cursor:pointer;transition:background .15s,transform .05s}
.btn:hover{background:var(--green-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--green);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:var(--bad)}
.btn.danger.ghost{background:transparent;color:var(--bad);border-color:#f0c9c4}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.link{background:none;border:0;padding:0;color:var(--green-2);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.field{display:grid;gap:6px}
.field>label,.lbl{font:600 13px/1.2 var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
.inp:focus{border-color:var(--green-2);outline:none;box-shadow:0 0 0 3px rgba(29,107,59,.15)}
textarea.inp{min-height:90px;resize:vertical}
.pin{letter-spacing:.5em;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{min-height:40px;padding:0 16px;border:0;border-radius:8px;background:transparent;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--green);color:#fff;box-shadow:var(--shadow)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;font-weight:500;font-size:15px}
.note{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

/* ── checkbox tiles ── */
.ticks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tick{position:relative;display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;user-select:none}
.tick input{position:absolute;opacity:0;pointer-events:none}
.tick .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid #9aa9a0;display:grid;place-items:center;background:#fff}
.tick .box svg{width:14px;height:14px;opacity:0}
.tick.on{border-color:var(--green-2);background:#eef7f0;box-shadow:inset 0 0 0 1px var(--green-2)}
.tick.on .box{background:var(--green-2);border-color:var(--green-2)}
.tick.on .box svg{opacity:1}
.tick b{display:block;font-weight:600}
.tick small{display:block;color:var(--muted);font-size:13px}
.tick.dis{cursor:not-allowed;background:var(--soft);color:var(--muted)}
.tick.dis .box{border-color:#cbd3cd}
.tick.busy small{color:var(--bad);font-weight:600}

/* ── pills ── */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font:600 13px/1.4 var(--f-cond);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-PENDING{background:var(--warn-bg);color:var(--warn)}
.p-APPROVED{background:var(--ok-bg);color:var(--ok)}
.p-REJECTED{background:var(--bad-bg);color:var(--bad)}
.p-CANCELLED{background:var(--none-bg);color:var(--none)}
.p-vacant{background:var(--ok-bg);color:var(--ok)}
.p-occupied{background:var(--bad-bg);color:var(--bad)}
.p-arriving{background:var(--warn-bg);color:var(--warn)}
.p-oos{background:var(--none-bg);color:var(--none)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font:600 12px/1.5 var(--f-cond);letter-spacing:.06em;text-transform:uppercase}
.t-Official{background:#e2f1e5;color:var(--official)}
.t-Private{background:#fbefd3;color:#8a5b00}
.t-role{background:#edf1ec;color:var(--green)}
.t-PMC{background:var(--field);color:var(--brass-2)}
.t-SECY{background:#fbefd3;color:#8a5b00}
.t-CO{background:var(--regt-red);color:#fff}
.t-HAV{background:#e7ecf3;color:#34507a}

/* ── loading ── */
.splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--field);z-index:5}
.splash .crest{width:110px;height:127px;background:var(--img-crest) center/contain no-repeat;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
.bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;background:linear-gradient(90deg,transparent,var(--brass),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:slide 1s linear infinite;display:none}
.bar.on{display:block}
@keyframes slide{from{background-position:-40% 0}to{background-position:140% 0}}

/* ── auth ── */
.auth{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.05fr .95fr;background:var(--field)}
.hero{position:relative;overflow:hidden;display:grid;place-items:center;align-content:center;gap:22px;padding:40px 24px;color:var(--ivory);
  background:radial-gradient(120% 80% at 50% 30%,#1a4a2f 0,var(--field) 62%)}
.hero .ribbon{position:absolute;top:0;bottom:0;left:50%;width:150px;transform:translateX(-50%);background:var(--ribbon);opacity:.95;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.hero .ribbon::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,44,27,.55),transparent 18%,transparent 82%,rgba(13,44,27,.55))}
.medallion{position:relative;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#1d4f33,#0b2516 70%);
  box-shadow:0 0 0 4px var(--brass),0 0 0 8px var(--field),0 0 0 10px rgba(201,164,83,.6),0 18px 40px rgba(0,0,0,.45);display:grid;place-items:center}
.medallion .crest{width:122px;height:141px;background:var(--img-crest) center/contain no-repeat;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.plaque{position:relative;padding:10px 26px;background:var(--field);border-top:2px solid var(--brass);border-bottom:2px solid var(--brass);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.plaque .motto{width:min(340px,70vw);aspect-ratio:1030/84;background:var(--img-motto) center/contain no-repeat}
.brand{position:relative;text-align:center}
.brand h1{font:700 clamp(28px,4vw,40px)/1.1 var(--f-brand);letter-spacing:.14em;color:var(--ivory);text-shadow:0 2px 10px rgba(0,0,0,.5)}
.brand p{margin:8px 0 0;font:600 14px/1 var(--f-cond);letter-spacing:.32em;text-transform:uppercase;color:var(--brass-2)}
.brand h1 span,.brand p span{background:var(--field);padding:2px 10px;border-radius:4px}
.auth-side{display:grid;place-items:center;padding:32px 20px;background:var(--paper)}
.auth-card{width:100%;max-width:420px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:26px 24px;display:grid;gap:18px}
.auth-card h2{font-size:22px;font-weight:700}
.auth-card .seg{width:100%}
.auth-card .seg button{flex:1}
.who{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px;background:#eef7f0;border:1px solid #cfe5d5}
.who .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font:700 15px var(--f-cond);letter-spacing:.05em}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--green-2)}
@media (max-width:900px){
  .auth{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .hero{padding:calc(34px + env(safe-area-inset-top)) 16px 30px;gap:16px}
  .hero .ribbon{width:96px}
  .medallion{width:150px;height:150px}
  .medallion .crest{width:92px;height:106px}
  .auth-side{place-items:start center;padding:0 16px 32px;background:linear-gradient(var(--field) 0 28px,var(--paper) 28px)}
}

/* ── app shell ── */
.app{position:relative;z-index:1;min-height:100vh;padding-bottom:84px}
.top{position:sticky;top:0;z-index:20;background:var(--field);color:var(--ivory);box-shadow:0 2px 12px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:62px}
.top .crest-sm{flex:none;width:34px;height:39px;background:var(--img-crest) center/contain no-repeat}
.top .ttl{display:grid;line-height:1.05}
.top .ttl b{font:700 17px/1.1 var(--f-brand);letter-spacing:.14em}
.top .ttl span{font:600 11px/1.4 var(--f-cond);letter-spacing:.3em;text-transform:uppercase;color:var(--brass-2)}
.top .stripe{height:6px;background:linear-gradient(180deg,var(--regt-red) 0 33%,var(--regt-yellow) 33% 67%,var(--regt-red) 67% 100%)}
.tabs-desk{display:flex;gap:4px;margin-left:24px}
.tabs-desk button{position:relative;min-height:40px;padding:0 14px;border:0;border-radius:8px;background:transparent;color:#cfd9d1;font-weight:600;cursor:pointer}
.tabs-desk button:hover{background:rgba(255,255,255,.07);color:#fff}
.tabs-desk button.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 -2px 0 var(--brass)}
.bell{margin-left:auto;position:relative;flex:none;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:var(--ivory);display:grid;place-items:center;cursor:pointer}
.bell svg{width:22px;height:22px}
.bell .badge{position:absolute;top:-2px;right:-4px;min-width:19px;height:19px;padding:0 5px;font-size:11px;box-shadow:0 0 0 2px var(--field)}
.bell + .me{margin-left:0}
.notes{display:grid;gap:6px}
.note-i{display:grid;grid-template-columns:10px 1fr;gap:10px;align-items:start;text-align:left;width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;cursor:pointer;font:inherit;color:inherit}
.note-i b{display:block;font-weight:500;font-size:14.5px;line-height:1.35}
.note-i small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.note-i .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;background:transparent}
.note-i.new{background:#f3f8f4;border-color:#cfe2d4}
.note-i.new b{font-weight:700}
.note-i.new .dot{background:var(--regt-red)}
.pushban{display:grid;gap:6px;padding:12px 14px;border-radius:12px;background:#fff8e6;border:1px solid #f0dfb4}
.pushban b{font-size:15px}
.pushban span{font-size:14px;color:var(--muted);line-height:1.4}
.pushrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;width:100%}
.pushrow .lbl{color:var(--muted)}
.me{margin-left:auto;display:flex;align-items:center;gap:10px;border:0;background:rgba(255,255,255,.08);color:var(--ivory);border-radius:99px;padding:5px 12px 5px 5px;cursor:pointer;max-width:56vw}
.me .av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--brass);color:var(--field);font:700 13px var(--f-cond)}
.me .nm{display:grid;text-align:left;line-height:1.1;min-width:0}
.me .nm b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .nm small{font:600 11px var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--brass-2)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--regt-red);color:#fff;font:700 12px var(--f-cond)}
.tabbar{display:none}
@media (max-width:860px){
  .tabs-desk{display:none}
  .me .nm{display:none}
  .me{padding:5px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:4px 3px calc(4px + env(safe-area-inset-bottom));gap:1px;box-shadow:0 -4px 18px rgba(13,44,27,.08)}
  .tabbar button{position:relative;flex:1 1 0;min-width:0;display:grid;justify-items:center;gap:1px;border:0;background:none;padding:5px 0 4px;border-radius:9px;color:var(--muted);font:600 12px/1.1 var(--f-cond);letter-spacing:0;cursor:pointer}
  .tabbar button svg{width:22px;height:22px}
  .tabbar .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 1px}
  .tabbar button.on{color:var(--green);background:#e9f3ec}
  .tabbar .badge{position:absolute;top:0;left:calc(50% + 3px);min-width:17px;height:17px;padding:0 4px;font-size:10.5px}
  .app.many .tabbar button{font-size:clamp(9.5px,2.75vw,12px)}
  .app.many .tabbar button svg{width:20px;height:20px}
  .app.many8 .tabbar button{font-size:clamp(8.5px,2.55vw,11px)}
  .app.many8 .tabbar .badge{left:calc(50% + 1px)}
}
main{max-width:1180px;margin:0 auto;padding:22px 16px 30px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
main>*{min-width:0}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font:700 22px/1.15 var(--f-ui)}
.btn svg{width:20px;height:20px}
.sec-h .kicker{font:600 13px/1 var(--f-cond);letter-spacing:.18em;text-transform:uppercase;color:var(--green-2);margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* ── today room cards ── */
.rooms{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:1000px){.rooms{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
/* phones: the five rooms in one compact row */
.rmob{display:none}
@media (max-width:600px){
  .rooms{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
  .rooms .room{padding:9px 2px 7px;gap:4px;justify-items:center;align-content:start;text-align:center;border-radius:10px}
  .rooms .room::before{left:0;right:0;top:0;bottom:auto;width:auto;height:4px;justify-self:stretch}
  .rooms .room .hd{justify-content:center}
  .rooms .room .hd b,.rooms .room .rpill,.rooms .room .info{display:none}
  .rooms .room .rno{width:24px;height:24px;font-size:12px}
  .rooms .rmob{display:grid;justify-items:center;gap:2px;min-width:0;max-width:100%}
  .rooms .rmob b{font:700 11.5px/1.1 var(--f-ui);hyphens:manual;-webkit-hyphens:manual}
  .rooms .rmob small{font:700 9px/1.15 var(--f-cond);letter-spacing:.02em;text-transform:uppercase;color:var(--ok);white-space:nowrap}
  .rooms .room.occupied .rmob small{color:var(--bad)}.rooms .room.arriving .rmob small{color:var(--warn)}.rooms .room.oos .rmob small{color:var(--none)}
  .rooms .rmob i{font-style:normal;font-size:10px;line-height:1.15;color:var(--muted)}
}
.room{position:relative;display:grid;gap:10px;padding:14px 14px 14px 18px;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--shadow);cursor:default;overflow:hidden}
.room::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ok)}
.room.occupied::before{background:var(--bad)}
.room.arriving::before{background:var(--warn)}
.room.oos::before{background:var(--none)}
.room.click{cursor:pointer}
.room.click:hover{border-color:#b9c8bd}
.room .hd{display:flex;align-items:center;gap:10px}
.rno{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--field);color:var(--brass-2);font:700 16px var(--f-brand)}
.room .hd b{font-size:17px;font-weight:700;letter-spacing:.01em}
.room .info{font-size:14px;color:var(--muted);min-height:40px}
.room .info strong{color:var(--ink);font-weight:600}

/* ── occupancy chart ── */
.chart-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chart-tools .range{font-weight:600;min-width:150px;text-align:center}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--green)}
.iconbtn svg{width:20px;height:20px}
.chart-wrap{overflow-x:auto;border-radius:var(--r);-webkit-overflow-scrolling:touch}
.chart{min-width:calc(118px + 28 * 26px)}
.ch-line{display:flex}
.ch-lab{flex:none;width:118px;position:sticky;left:0;z-index:3;background:#fff;border-right:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px;font-weight:600;font-size:14px}
.ch-lab .rno{width:26px;height:26px;font-size:13px}
.ch-track{flex:1;display:grid;grid-template-columns:repeat(28,minmax(26px,1fr));grid-template-rows:48px;position:relative}
.ch-head .ch-track{grid-template-rows:auto}
.ch-head .ch-lab{background:var(--soft);font:600 12px var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ch-day{grid-column:span 2;padding:7px 2px 3px;text-align:center;font:600 12px/1.15 var(--f-cond);color:var(--muted);background:var(--soft);border-left:1px solid var(--line)}
.ch-day b{display:block;font-size:15px;color:var(--ink)}
.ch-day.today{background:var(--field);color:var(--brass-2)}
.ch-day.today b{color:#fff}
.ch-day.wk{background:#e8eee6}
.ch-half{padding:2px 0 4px;text-align:center;font:600 10px var(--f-cond);letter-spacing:.06em;color:#8a978e;background:var(--soft);border-left:1px solid var(--line)}
.ch-half.an{border-left-style:dotted}
.ch-line+.ch-line{border-top:1px solid var(--line)}
.ch-head{border-bottom:1px solid var(--line)}
.ch-c{grid-row:1;border-left:1px solid #edf1ec}
.ch-c.an{border-left:1px dotted #e3e9e2}
.ch-c.wk{background:#f6f8f5}
.ch-c.today{background:#fff8e6}
.ch-c.now{box-shadow:inset 2px 0 0 var(--regt-red)}
.ch-oos{grid-row:1;grid-column:1/-1;background:repeating-linear-gradient(135deg,#f1f3f1 0 8px,#e6eae6 8px 16px);display:grid;place-items:center;font:600 12px var(--f-cond);letter-spacing:.1em;color:var(--none);text-transform:uppercase}
.blk{grid-row:1;z-index:2;margin:6px 1px;border:0;border-radius:7px;padding:0 8px;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:600 13px/1 var(--f-ui);cursor:pointer;text-align:left}
.blk.Official{background:var(--official);color:#fff}
.blk.Private{background:var(--private);color:var(--private-ink)}
.blk.Blocked{background:repeating-linear-gradient(135deg,#5f6b63 0 6px,#6f7b73 6px 12px);color:#fff}
.lg-blocked{background:repeating-linear-gradient(135deg,#5f6b63 0 3px,#6f7b73 3px 6px)}
.blk.mine{box-shadow:inset 0 0 0 2px var(--field),inset 0 0 0 4px rgba(255,255,255,.55)}
.blk.gone{opacity:.45}
.p-left{background:#eceff0;color:#56636b}
.stay-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stay-acts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.stay-acts .btn{flex:1 1 140px}
.stay-acts .btn[data-v=undo]{flex:0 0 auto}
.side .pill{margin-top:6px}
.blk.cl{border-top-left-radius:0;border-bottom-left-radius:0}
.blk.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.blk span{overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}

/* ── lists ── */
.list{display:grid;gap:12px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:14px 16px}
.item .rno{width:40px;height:40px;font-size:18px}
.item .rno.none{background:var(--soft);color:var(--muted);border:1px dashed #b9c4bc;font-size:14px}
.item h3{font-size:17px;font-weight:700;line-height:1.25}
.item .meta{color:var(--muted);font-size:14px;margin-top:3px}
.item .dates{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-weight:600;font-size:15px}
.item .dates .arr{color:var(--muted)}
.item .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.item .rmk{margin-top:10px;padding:8px 10px;background:var(--soft);border-radius:8px;font-size:14px}
@media (max-width:560px){.item{grid-template-columns:auto 1fr}.item>.side{grid-column:1/-1;justify-self:start}}
.click{cursor:pointer}
.item.click:hover{border-color:#b9c8bd}

/* ── request form ── */
.form{display:grid;gap:0}
.fs{padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.fs>*{min-width:0}
.fs+.fs{border-top:1px solid var(--line)}
.fs h3{font:700 13px/1 var(--f-cond);letter-spacing:.16em;text-transform:uppercase;color:var(--green-2);display:flex;align-items:center;gap:10px}
.fs h3 .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--field);color:var(--brass-2);font-size:12px;letter-spacing:0}
.when{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.when{grid-template-columns:1fr}}
.when .field .row{flex-wrap:nowrap}
.when .field .inp{flex:1;min-width:0}
.stay{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:#eef7f0;color:var(--green);font-weight:600;font-size:15px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.stepper button{width:48px;height:48px;border:0;background:var(--soft);font-size:22px;font-weight:600;color:var(--green);cursor:pointer}
.stepper input{width:64px;height:48px;border:0;text-align:center;font-size:18px;font-weight:700}
.form-foot{padding:16px 18px;border-top:1px solid var(--line);background:var(--soft);border-radius:0 0 var(--r) var(--r);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* ── approvals ── */
.appr{display:grid;gap:14px;padding:16px}
.appr .top-l{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px}
.kv div{display:grid;gap:2px}
.kv span{font:600 12px var(--f-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kv b{font-weight:600}
.allot{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.allot .tick small.pref{color:var(--warn);font-weight:600}

/* ── officers ── */
.otable{width:100%;border-collapse:collapse}
.otable th{font:600 12px var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.otable td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.otable tr:last-child td{border-bottom:0}
.otable .nm{font-weight:600}
.otable .sub{color:var(--muted);font-size:13px}
@media (max-width:720px){
  .otable thead{display:none}
  .otable tr{display:grid;grid-template-columns:1fr auto;padding:12px 14px;border-bottom:1px solid var(--line);gap:6px}
  .otable td{padding:0;border:0}
  .otable td.c-acts{grid-column:1/-1}
}
details.card>summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";font-size:22px;color:var(--green)}
details.card[open]>summary::after{content:"–"}
details.card>.pad{border-top:1px solid var(--line)}
@media (max-width:720px){
  main{padding:12px 10px 18px;gap:14px}
  .sec-h{gap:8px}
  .sec-h h2{font-size:18px}

<body>
<div class="bar" id="bar"></div>
<div id="root"><div class="splash"><div class="crest" role="img" aria-label="Loading"></div></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function () {
'use strict';

/* ───────── state ───────── */
var S = {
  token: null, data: null, view: 'board', winStart: null, busy: 0,
  auth: { mode: 'signin', step: 1, mobile: '', name: '', masked: '', error: '', info: '' },
  form: blankForm(), formError: '',
  allot: {}, rejecting: null, rejectRemarks: {},
  off: { name: '', mobile: '', role: 'OFFR' }, bulk: '', bulkResult: null,
  modal: null, lastPending: null, lastMine: null,
  arrFilter: 'all', arrNotes: {}, plans: {}, planNew: {}, overflow: []
};
var VIEWS = [
  { id: 'board', label: 'Board', icon: 'grid' },
  { id: 'request', label: 'New request', short: 'Request', icon: 'plus' },
  { id: 'mine', label: 'My requests', short: 'Mine', icon: 'list' },
  { id: 'approvals', label: 'Approvals', tab: 'Approve', icon: 'check', role: 'PMC' },
  { id: 'arrivals', label: 'Arrivals', icon: 'phone', roles: ['PMC', 'SECY', 'HAV'] },
  { id: 'manage', label: 'Bookings', icon: 'book', roles: ['SECY', 'PMC'] },
  { id: 'officers', label: 'Officers', icon: 'users', roles: ['SECY', 'CO', 'PMC'] }
];
/* phone tab bar: when there are more than five tabs, these come first and the rest go under More */
var PRI = { board: 1, approvals: 2, arrivals: 3, request: 4, manage: 5, mine: 6, officers: 8 };
var ICONS = {
  phone: '<path d="M6.6 3.5h2.6l1.4 4.2-2 1.4a12 12 0 006.3 6.3l1.4-2 4.2 1.4v2.6a2 2 0 01-2.2 2A16.6 16.6 0 014.6 5.7a2 2 0 012-2.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  more: '<circle cx="5" cy="12" r="1.9" fill="currentColor"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/><circle cx="19" cy="12" r="1.9" fill="currentColor"/>',
  bell: '<path d="M6 16.5V11a6 6 0 0112 0v5.5l1.5 2H4.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 20.5a2.2 2.2 0 004 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  chat: '<path d="M12 3.5a8.5 8.5 0 00-7.4 12.7L3.5 20.5l4.4-1.1A8.5 8.5 0 1012 3.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 10.5h7M8.5 13.5h4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  copy: '<rect x="8" y="8" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 15V6a1 1 0 011-1h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  grid: '<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  plus: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="4.5" cy="6" r="1.4" fill="currentColor"/><circle cx="4.5" cy="12" r="1.4" fill="currentColor"/><circle cx="4.5" cy="18" r="1.4" fill="currentColor"/>',
  check: '<path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 12l2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
  users: '<circle cx="9" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15.5 5.2a3 3 0 010 5.6M17.5 14.3c1.6.6 2.7 2.2 3 4.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  book: '<path d="M5 4.5h11a3 3 0 013 3V20H8a3 3 0 01-3-3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M5 17a3 3 0 013-3h11" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 8.5h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  left: '<path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  right: '<path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  tick: '<path d="M3 8.5l3 3 7-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'
};
function icon(n, vb) { return '<svg viewBox="' + (vb || '0 0 24 24') + '" aria-hidden="true">' + ICONS[n] + '</svg>'; }
function blankForm() { return { dateIn: '', slotIn: 'AN', dateOut: '', slotOut: 'FN', guest: '', guests: 1, rooms: 1, mobile: '', purpose: '', pref: [] }; }

/* ───────── utils ───────── */
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function dayNum(s) { var p = String(s).split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]) / 864e5; }
function fromNum(n) { var d = new Date(n * 864e5); return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2); }
function addDays(s, n) { return fromNum(dayNum(s) + n); }
function dow(s) { return new Date(dayNum(s) * 864e5).getUTCDay(); }
function fmt(s, long) { if (!s) return ''; var d = new Date(dayNum(s) * 864e5); return DOW[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MON[d.getUTCMonth()] + (long ? ' ' + d.getUTCFullYear() : ''); }
function fmtShort(s) { var d = new Date(dayNum(s) * 864e5); return d.getUTCDate() + ' ' + MON[d.getUTCMonth()]; }
function slotIdx(d, s) { return dayNum(d) * 2 + (s === 'AN' ? 1 : 0); }
function bIn(b) { return slotIdx(b.dateIn, b.slotIn); }
function bOut(b) { return slotIdx(b.dateOut, b.slotOut); }
function initials(n) { var w = String(n || '').replace(/[^A-Za-z ]/g, ' ').trim().split(/\s+/); return ((w.length > 1 ? w[w.length - 2][0] : '') + (w[w.length - 1] || '?')[0]).toUpperCase(); }
function roomOf(no) { var r = (S.data.rooms || []).filter(function (x) { return x.no === Number(no); })[0]; return r || { no: no, name: 'Room ' + no }; }
function roomLabel(no) { var r = roomOf(no); return r.name + ' (No ' + r.no + ')'; }
function nowIdx() { return slotIdx(S.data.today, S.data.nowHour < 12 ? 'FN' : 'AN'); }
function stayText(f) {
  var halves = slotIdx(f.dateOut, f.slotOut) - slotIdx(f.dateIn, f.slotIn);
  var nights = dayNum(f.dateOut) - dayNum(f.dateIn);
  return nights > 0 ? nights + (nights === 1 ? ' night' : ' nights') : (halves > 0 ? 'Day use' : '');
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function $(sel) { return document.querySelector(sel); }

/* ───────── server calls ───────── */
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  var api = String(window.PIFFER_API || '');
  if (!/^https?:\/\//.test(api)) return Promise.reject(new Error('The app is not connected yet. Mess Secy: put the Web app link in config.js.'));
  busy(1);
  return fetch(api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow' })
    .then(function (res) { if (!res.ok) throw new Error('net'); return res.json(); })
    .then(function (r) {
      busy(-1);
      if (r && r.ok) return r.data;
      throw new Error(r && r.error ? r.error : 'No response from the server. Try again.');
    }, function () {
      busy(-1);
      throw new Error('Could not reach the server. Check your internet and try again.');
    });
}
function busy(d) { S.busy = Math.max(0, S.busy + d); $('#bar').classList.toggle('on', S.busy > 0); }
function handleErr(e) {
  var m = String(e && e.message || e);
  if (m.indexOf('SESSION:') === 0) { signOutLocal(m.replace('SESSION:', '').trim()); return; }
  toast(m, true);
}
function toast(msg, bad) {
  var t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(function () { t.remove(); }, bad ? 6000 : 4200);
}

/* ───────── auth flow ───────── */
function signOutLocal(info) {
  S.token = null; S.data = null; S.modal = null; store('pm_token', null);
  S.auth = { mode: 'signin', step: 1, mobile: S.auth.mobile || '', name: '', masked: '', error: '', info: info || '' };
  render();
}
function gotState(st, isFirst) {
  var prev = S.data;
  (st.blocks || []).forEach(function (k) {
    st.bookings.push({ id: k.id, room: k.room, dateIn: k.dateIn, slotIn: k.slotIn, dateOut: k.dateOut, slotOut: k.slotOut,
      blocked: true, guest: 'Blocked', by: k.by, byId: k.byId, reason: k.reason, purpose: 'Blocked', guests: 0 });
  });
  S.data = st;
  if (!S.winStart) S.winStart = st.today;
  if (!canSee(S.view)) S.view = 'board';
  if (prev && !isFirst) notifyChanges(prev, st);
  S.lastPending = st.pending.map(function (p) { return p.id; });
}
function allowed(def) {
  var r = S.data ? S.data.me.role : '';
  var ok = !def.role && !def.roles ? true : def.role ? def.role === r : def.roles.indexOf(r) >= 0;
  return ok && (!def.when || (!!S.data && def.when()));
}
function canSee(v) {
  var def = VIEWS.filter(function (x) { return x.id === v; })[0];
  return def && allowed(def);
}
function isAdmin() { return S.data.me.role === 'SECY' || S.data.me.role === 'CO'; }
function canManage() { return isAdmin() || S.data.me.role === 'PMC'; }
function canEditOfficers() { return canManage(); }
function canAddExisting() { return S.data.me.role === 'SECY' || S.data.me.role === 'PMC'; }
function notifyChanges(prev, st) {
  if (st.me.role === 'PMC') {
    var old = {}; prev.pending.forEach(function (p) { old[p.id] = 1; });
    st.pending.forEach(function (p) { if (!old[p.id]) toast('New request from ' + p.by + ': ' + p.guest + ', ' + fmtShort(p.dateIn) + ' ' + p.slotIn); });
  }
  var was = {}; prev.mine.forEach(function (m) { was[m.id] = m.status; });
  st.mine.forEach(function (m) {
    if (was[m.id] && was[m.id] !== m.status && m.cancelledBy !== st.me.name) {
      if (m.status === 'APPROVED') toast('Approved: ' + roomLabel(m.room) + ' for ' + m.guest);
      else if (m.status === 'REJECTED') toast('Not approved: request for ' + m.guest, true);
      else if (m.status === 'CANCELLED') toast('Cancelled' + (m.cancelledBy ? ' by ' + m.cancelledBy : '') + ': booking for ' + m.guest, true);
    }
  });
}
function seenKey() { return 'pm_seen_' + S.data.me.id; }
function seenMap() { try { return JSON.parse(store(seenKey()) || '{}'); } catch (e) { return {}; } }
function unseenCount() {
  var seen = seenMap();
  return S.data.mine.filter(function (m) { return m.status !== 'PENDING' && seen[m.id] !== m.status && m.cancelledBy !== S.data.me.name; }).length;
}
function markSeen() { var m = {}; S.data.mine.forEach(function (x) { m[x.id] = x.status; }); store(seenKey(), JSON.stringify(m)); }

function refresh(silent) {
  if (!S.token) return Promise.resolve();
  return call('apiState', S.token).then(function (st) { gotState(st); if (!editing()) render(); else renderBadges(); })
    .catch(function (e) { if (!silent || String(e.message).indexOf('SESSION:') === 0) handleErr(e); });
}
function editing() {
  var a = document.activeElement;
  return S.modal || S.view === 'request' || S.view === 'officers' || (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName));
}

/* ───────── render: auth ───────── */
function renderAuth() {
  var A = S.auth, body = '';
  var tabs = '<div class="seg" role="tablist"><button data-act="authMode" data-v="signin" class="' + (A.mode === 'signin' ? 'on' : '') + '">Sign in</button>' +
    '<button data-act="authMode" data-v="register" class="' + (A.mode === 'register' ? 'on' : '') + '">Register</button></div>';
  var err = A.error ? '<div class="err" role="alert">' + esc(A.error) + '</div>' : '';
  var info = A.info ? '<div class="note">' + esc(A.info) + '</div>' : '';
  var mobileField = '<div class="field"><label for="a-mobile">Mobile number</label><input class="inp num" id="a-mobile" type="tel" inputmode="numeric" autocomplete="tel" maxlength="14" placeholder="10-digit number" value="' + esc(A.mobile) + '"></div>';

function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
function authErr(msg) { S.auth.error = msg; S.auth.info = ''; render(); }
function afterLogin(r) {
  S.token = r.token; store('pm_token', r.token);
  S.view = 'board'; S.winStart = null; gotState(r.state, true); afterSignIn(); render();
  toast('Welcome, ' + r.state.me.name);
}
var A = {
  authMode: function (el) { S.auth.mode = el.dataset.v; S.auth.step = 1; S.auth.error = ''; S.auth.info = ''; S.auth.name = ''; S.auth.own = false; render(); },
  signin: function () {
    S.auth.mobile = val('a-mobile');
    var pin = val('a-pin');
    if (!/^\d{4}$/.test(pin)) return authErr('Enter the 4-digit PIN.');
    call('apiLogin', S.auth.mobile, pin).then(function (r) {
      if (r.needOwnPin) { S.auth.mode = 'ownpin'; S.auth.fresh = true; S.auth.masked = r.masked; S.auth.roleLabel = r.roleLabel; S.auth.error = ''; render(); toast('Code sent to ' + r.masked); return; }
      afterLogin(r);
    }).catch(function (e) { authErr(e.message); });
  },
  regLookup: function () {
    S.auth.mobile = val('a-mobile');
    call('apiLookup', S.auth.mobile).then(function (r) {
      if (r.status === 'NOT_LISTED') return authErr('This number is not on the mess list. Contact the Mess Secy.');
      if (r.status === 'REGISTERED') { S.auth.mode = 'signin'; S.auth.error = ''; S.auth.info = r.name + ', you are already registered. Sign in with your PIN.'; return render(); }
      S.auth.name = r.name; S.auth.own = !!r.own; S.auth.roleLabel = r.roleLabel; S.auth.step = 2; S.auth.error = ''; render();
    }).catch(function (e) { authErr(e.message); });
  },
  regBack: function () { S.auth.step = 1; S.auth.name = ''; S.auth.error = ''; render(); },
  regEmail: function () {
    var email = val('a-email');
    call('apiRegisterStart', S.auth.mobile, email).then(function (r) { S.auth.masked = r.masked; S.auth.step = 3; S.auth.error = ''; render(); toast('Code sent to ' + r.masked); })
      .catch(function (e) { authErr(e.message); });
  },
  regResend: function () { S.auth.step = 2; S.auth.error = ''; render(); },
  regFinish: function () {
    var code = val('a-code'), pin = val('a-pin'), own = val('a-own'), own2 = val('a-own2');
    if (!/^\d{6}$/.test(code)) return authErr('Enter the 6-digit code from the email.');
    if (!/^\d{4}$/.test(pin)) return authErr('Enter the 4-digit mess PIN.');
    if (S.auth.own) {
      if (!/^\d{4}$/.test(own)) return authErr('Choose your own 4-digit PIN.');

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  var fn = A[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'BUTTON' || el.tagName === 'A') ev.preventDefault();
  fn(el, ev);
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && S.modal) return A.close();
  if (ev.key === 'Enter' && ev.target.matches('.auth-card input')) {
    ev.preventDefault();
    var b = document.querySelector('.auth-card .btn.block'); if (b) b.click();
  }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role="button"][data-act]')) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.dataset.plan) {
    var pid = t.dataset.plan, pb = S.data.bookings.filter(function (x) { return x.id === pid; })[0];
    if (!pb) return;
    var pd = S.plans[pid] = S.plans[pid] || Object.assign({}, planDraft(pb));
    pd[t.dataset.k] = t.value;
    if (t.dataset.k === 'ad' && pd.dd && pd.dd < pd.ad) { pd.dd = pd.ad; var od = document.querySelector('[data-plan="' + pid + '"][data-k="dd"]'); if (od) od.value = pd.dd; }
    var ph = document.getElementById('ph-' + pid), h = planHint(pb, pd);
    if (ph) { ph.className = 'plan-hint ' + h.cls; ph.innerHTML = h.html; }
    return;
  }
  if (t.dataset.f) {
    var k = t.dataset.f;
    S.form[k] = k === 'guests' ? Math.min(20, Math.max(1, Number(t.value.replace(/\D/g, '')) || 1)) : k === 'rooms' ? Math.min(S.data.rooms.length, Math.max(1, Number(t.value.replace(/\D/g, '')) || 1)) : t.value;
    if (k === 'rooms') { if (directBook() && S.form.pref.length > S.form.rooms) S.form.pref = S.form.pref.slice(-S.form.rooms); updateFormBits(); }
    if (k === 'dateIn' && S.form.dateOut && S.form.dateOut < S.form.dateIn) { S.form.dateOut = ''; var o = $('#f-dateOut'); if (o) o.value = ''; }
    if (k === 'dateIn' || k === 'dateOut') updateFormBits();
  } else if (t.dataset.bk) {
    var bk = t.dataset.bk;
    S.bk[bk] = t.value;
    if (bk === 'dateIn' || bk === 'dateOut') bkRefreshRooms();
  } else if (t.dataset.rj) {
    S.rejectRemarks[t.dataset.rj] = t.value;
  } else if (t.id === 'o-bulk') { S.bulk = t.value; }
  else if (t.dataset.arr) { S.arrNotes[t.dataset.arr] = t.value; }
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.dataset.pref) {
    var n = Number(t.dataset.pref), i = S.form.pref.indexOf(n);
    if (t.checked && i < 0) S.form.pref.push(n);
    if (!t.checked && i >= 0) S.form.pref.splice(i, 1);
    t.closest('.tick').classList.toggle('on', t.checked);
  } else if (t.dataset.purpose) {
    S.form.purpose = t.checked ? t.dataset.purpose : '';
    document.querySelectorAll('[data-purpose]').forEach(function (x) { x.checked = x.dataset.purpose === S.form.purpose; x.closest('.tick').classList.toggle('on', x.checked); });
  } else if (t.dataset.coroom) {
    var n = Number(t.dataset.coroom), need = Number(S.form.rooms) || 1;
    if (need === 1) S.form.pref = t.checked ? [n] : [];
    else if (t.checked) { S.form.pref = S.form.pref.filter(function (x) { return x !== n; }).concat([n]); if (S.form.pref.length > need) S.form.pref.shift(); }
    else S.form.pref = S.form.pref.filter(function (x) { return x !== n; });
    S.formError = ''; updateFormBits();
  } else if (t.dataset.bkroom) {
    S.bk.room = Number(t.dataset.bkroom); bkRefreshRooms();
  } else if (t.dataset.bkpurpose) {
    S.bk.purpose = t.checked ? t.dataset.bkpurpose : '';
    document.querySelectorAll('[data-bkpurpose]').forEach(function (x) { x.checked = x.dataset.bkpurpose === S.bk.purpose; x.closest('.tick').classList.toggle('on', x.checked); });
  } else if (t.id === 'bk-off') {
    S.bk.officerId = t.value;
  } else if (t.dataset.spoken) {
    var sid = t.dataset.spoken, sb = S.data.bookings.filter(function (x) { return x.id === sid; })[0];
    var sInp = document.querySelector('[data-arr="' + sid + '"]'), sNote = sInp ? sInp.value.trim() : (sb && sb.arrivalNote) || '';
    t.disabled = true;
    call('apiMarkSpoken', S.token, sid, t.checked, sNote).then(function (st) { delete S.arrNotes[sid]; gotState(st); render(); toast(t.checked ? 'Marked: spoken to ' + (sb ? sb.guest : 'guest') : 'Unmarked'); })
      .catch(function (e) { t.disabled = false; t.checked = !t.checked; handleErr(e); });
  } else if (t.dataset.allot) {
    var pid = t.dataset.allot, rn = Number(t.value), pr = S.data.pending.filter(function (x) { return x.id === pid; })[0], lim = pr ? pr.rooms || 1 : 1;
    var curA = (S.allot[pid] || []).slice();
    if (lim === 1) curA = t.checked ? [rn] : [];
    else if (t.checked) { curA = curA.filter(function (x) { return x !== rn; }).concat([rn]); if (curA.length > lim) curA.shift(); }
    else curA = curA.filter(function (x) { return x !== rn; });
    S.allot[pid] = curA; render();
  }
});
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && S.token) refresh(true); });
setInterval(function () { if (document.visibilityState === 'visible' && S.token && !S.busy) refresh(true); }, 60000);

/* ───────── render root ───────── */
function render() {
  var root = $('#root');
  var y = window.scrollY;
  root.innerHTML = S.data ? renderApp() : renderAuth();
  if (S.data) window.scrollTo(0, y);
  renderModal();
  if (S.data) { setAppBadge(); readViewNotes(); }
}

/* ───────── boot ───────── */
S.token = store('pm_token');
if (S.token) {
  call('apiState', S.token).then(function (st) { gotState(st, true); afterSignIn(); render(); })
    .catch(function (e) { var m = String(e.message); signOutLocal(m.indexOf('SESSION:') === 0 ? m.replace('SESSION:', '').trim() : ''); if (m.indexOf('SESSION:') !== 0) toast(m, true); });
} else {
  render();
}
})();
</script>

if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
